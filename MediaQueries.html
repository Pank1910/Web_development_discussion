<html>
    <head>
        <style>
            body {
                font-size: 16px;
            }
        
            @media (max-width: 768px) {
                body {
                    font-size: 14px;
                }
            }
        
            @media (max-width: 480px) {
                body {
                    font-size: 12px;
                }
            }
        </style>
    </head>
    <body>
        <p>Responsive text size based on screen width.</p>
    </body>
</html>
